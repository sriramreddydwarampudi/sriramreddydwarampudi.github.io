
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scatter Plot with Derived Unique Numbers and Categories</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>3D Scatter Plot with 27 Points</h1>
    <div id="myDiv" style="width: 800px; height: 800px;"></div>

    <h2>Table of 27 Points with Derived Unique Numbers and Categories</h2>
    <table>
        <thead>
            <tr>
                <th>Unique Number</th>
                <th>Coordinates (x, y, z)</th>
                <th>Flattened Index</th>
                <th>Category</th>
                <th>Area Classification</th>
                <th>Sides</th>
                <th>Area By</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <script>
        let x = [], y = [], z = [];
        let points = [];

        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                for (let k = 0; k < 3; k++) {
                    let xCoord = i - 1;
                    let yCoord = j - 1;
                    let zCoord = k - 1;

                    x.push(xCoord);
                    y.push(yCoord);
                    z.push(zCoord);

                    let uniqueNumber = i * 9 + j * 3 + k + 1;

                    // Category Classification (Corner, Edge, Mid)
                    let category = '';
                    let nonZeroCount = [xCoord !== 0, yCoord !== 0, zCoord !== 0].filter(Boolean).length;
                    if (nonZeroCount === 3) {
                        category = 'Corner';
                    } else if (nonZeroCount === 2) {
                        category = 'Edge';
                    } else if (nonZeroCount === 1) {
                        category = 'Mid';
                    } else {
                        category = 'Center';
                    }

                    // Area Classification (Priority: Z > Y > X)
                    let area = '';
                    if (zCoord === -1) {
                        area = 'Cervical';
                    } else if (yCoord === 1 || yCoord === -1) {
                        area = 'Proximal';
                    } else if (xCoord === 1 || xCoord === -1 || zCoord === 1) {
                        area = 'Pit and Fissure';
                    } else {
                        area = 'Smooth Surface';
                    }

                    // Determine number of sides involved
                    let nonzeroCount = [zCoord !== 0, yCoord !== 0, xCoord !== 0].filter(Boolean).length;
                    let sides = nonzeroCount + "-side";

                    // Area By Classification
                    let areaBy = [];
                    if (xCoord === 1) areaBy.push('Buccal');
                    else if (xCoord === -1) areaBy.push('Lingual');
                    else areaBy.push('No Mention');

                    if (yCoord === 1) areaBy.push('Mesial');
                    else if (yCoord === -1) areaBy.push('Distal');
                    else areaBy.push('No Mention');

                    if (zCoord === 1) areaBy.push('Occlusal');
                    else if (zCoord === -1) areaBy.push('Third');
                    else areaBy.push('No Mention');

                    let areaByString = areaBy.join(', ');

                    points.push({
                        uniqueNumber: uniqueNumber,
                        coordinates: `(${xCoord}, ${yCoord}, ${zCoord})`,
                        flattenedIndex: x.length - 1,
                        category: category,
                        area: area,
                        sides: sides,
                        areaBy: areaByString
                    });
                }
            }
        }

        let tableBody = document.getElementById('tableBody');
        points.forEach(point => {
            let row = `<tr>
                <td>${point.uniqueNumber}</td>
                <td>${point.coordinates}</td>
                <td>${point.flattenedIndex}</td>
                <td>${point.category}</td>
                <td>${point.area}</td>
                <td>${point.sides}</td>
                <td>${point.areaBy}</td>
            </tr>`;
            tableBody.innerHTML += row;
        });

        let trace = {
            x: x,
            y: y,
            z: z,
            mode: 'markers',
            marker: {
                size: 12,
                color: z,
                colorscale: 'Viridis',
                opacity: 0.8
            },
            type: 'scatter3d'
        };

        let layout = {
            margin: { l: 0, r: 0, b: 0, t: 0 },
            scene: {
                xaxis: { title: 'X Axis', range: [-1.5, 1.5] },
                yaxis: { title: 'Y Axis', range: [-1.5, 1.5] },
                zaxis: { title: 'Z Axis', range: [-1.5, 1.5] }
            }
        };

        Plotly.newPlot('myDiv', [trace], layout);
    </script>
</body>
</html>
