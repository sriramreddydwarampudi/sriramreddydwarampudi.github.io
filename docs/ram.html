<div id="netlify-auth" class="md-header__button md-identity" style="margin-left: auto;">
  <button id="netlify-login-btn" class="md-icon" style="all: unset; cursor: pointer; padding: 0 0.5em; color: var(--md-accent-fg-color);">
    Login
  </button>
</div>



<script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (window.netlifyIdentity) {
      function updateLoginButton(user) {
        const btn = document.getElementById("netlify-login-btn");
        if (!btn) return;
        if (user) {
          btn.textContent = user.user_metadata.full_name || "Logout";
          btn.onclick = () => netlifyIdentity.logout();
        } else {
          btn.textContent = "Login";
          btn.onclick = () => netlifyIdentity.open();
        }
      }

      netlifyIdentity.on("init", user => updateLoginButton(user));
      netlifyIdentity.on("login", user => {
        updateLoginButton(user);
        netlifyIdentity.close();
      });
      netlifyIdentity.on("logout", () => updateLoginButton(null));
      netlifyIdentity.init();
    }
  });
</script>
