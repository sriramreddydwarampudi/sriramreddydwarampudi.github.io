name: Export Book (PDF, EPUB, HTML) per Folder

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-books:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Main Branch
        uses: actions/checkout@v4

      - name: 📦 Install Pandoc + LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex fonts-dejavu

      - name: 📚 Convert Each Folder to Book Formats
        run: |
          mkdir -p output_books
          for dir in */; do
            folder=$(basename "$dir")
            sanitized=$(echo "$folder" | tr -cd '[:alnum:]_' | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
            md_files=$(find "$dir" -name '*.md' | sort)
            if [ -n "$md_files" ]; then
              pandoc $md_files -o output_books/${sanitized}.pdf \
                --toc --pdf-engine=xelatex \
                -V geometry:a4paper -V fontsize=12pt -V mainfont="DejaVu Serif"
              
              pandoc $md_files -o output_books/${sanitized}.epub \
                --toc --metadata title="$folder"

              pandoc $md_files -o output_books/${sanitized}.html \
                --toc --standalone --css=https://cdn.jsdelivr.net/npm/water.css@2/out/water.css
            fi
          done

      - name: 🖼️ Upload Final Books to gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: 📁 Move Books to gh-pages/books/
        run: |
          mkdir -p gh-pages/books
          cp output_books/* gh-pages/books/

      - name: 🚀 Commit & Push Books
        run: |
          cd gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add books/*
          git commit -m "📘 Auto-exported books (PDF, EPUB, HTML)" || echo "No changes"
          git push origin gh-pages
